[project]
name = "lucy-assets"
version = "0.1.0"
description = "Reproducible non-AI extraction and vector tooling for Lucy source references"
readme = "README.md"
authors = [
    { name = "aphrody-dev", email = "contact@aphrody.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
]

[project.scripts]
lucy-extract = "lucy_assets.extract:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
